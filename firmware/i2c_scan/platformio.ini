;
; TEMPORARY DIAGNOSTIC firmware — an I2C bus scanner, nothing else.
;
; The main firmware cannot print diagnostics: micro-ROS owns the serial port, so any Serial
; output corrupts the transport. This standalone sketch isolates the I2C question completely —
; no micro-ROS, no motors, no timing pressure. If the bus is miswired it says so cleanly.
;
; FLASH THIS ONLY TEMPORARILY. The robot is non-functional while it runs (no motor control,
; no odometry, no prox). Re-flash firmware/esp32 immediately afterwards.
;   ~/tools/esptool-linux-aarch64/esptool --port /dev/jupiter_esp32 --baud 460800 --chip esp32 \
;       write-flash -z 0x10000 ~/firmware_new/firmware.bin
;
; NOTE 115200 here, NOT the 460800 the real firmware uses for micro-ROS.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/jupiter_esp32
upload_speed = 115200
monitor_speed = 115200
monitor_port = /dev/jupiter_esp32
; VL53L0X init is genuinely complex (SPAD map, ref/VHV/phase calibration). A hand-rolled
; minimal init ACKs on the bus but never completes a ranging cycle -- use the real driver.
lib_deps =
    pololu/VL53L0X@^1.3.1

platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.17
